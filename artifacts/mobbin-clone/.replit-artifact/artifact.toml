kind = "web"
previewPath = "/"
title = "Mobbin Clone"
version = "1.0.0"
id = "artifacts/mobbin-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23731

[services.development]
run = "pnpm --filter @workspace/mobbin-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobbin-clone", "run", "build" ]
publicDir = "artifacts/mobbin-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23731"
BASE_PATH = "/"
